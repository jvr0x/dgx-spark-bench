# Harness run config for the qwen3.8-flash-next single-Spark recipe (Mia's).
# Runs ON the Spark, against the vLLM server on :8890.
#
#   cd ~/dev/miaai-lab/Qwen3.8-Flash-Next-Single-DGX-Spark && ./start.sh
#   cd ~/dev/dgx-spark-bench/harness
#   taskset -c 0,1 .venv/bin/python bench.py \
#     ../recipes/qwen3.8-flash-next-single/harness.yaml \
#     -o ../results/qwen3.8-flash-next-single.json
#
# Recipe: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark

series:
  id: qwen3.8-flash-next-single-nothinking
  model: Qwen3.8-Flash-Next
  params_b: 125
  quant: NVFP4 (Mia-AiLab)
  backend: vLLM qwen38-flash-next image
  status: measured
  weights_gb: 99
  recipe_url: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark
  config:
    checkpoint: Mia-AiLab/Qwen3.8-Flash-Next-NVFP4
    runtime: vLLM
    quantization: NVFP4, PLE table offloaded + memory-mapped (MADV_RANDOM)
    architecture: MoE 125B total / 6B active, hybrid GDN + QSA, vision-language
    kv_cache_dtype: fp8
    ctx: 262144
    max_num_seqs: 4
    speculative: MTP k=3
    note: "Mia's single-Spark recipe; PLE n-gram table offloaded to host RAM, ~99 GB checkpoint."

engine:
  base_url: http://localhost:8890
  model: qwen3.8-flash-next-single   # lmswitch served-model-name (= yaml id); upstream
                                     # default is qwen3.8-flash-next, overridden by the recipe
  api_key: dummy
  extra_body:
    ignore_eos: true
    min_tokens: 256
    # Thinking OFF: the model thinks by default and the reasoning trace
    # decodes slower (low MTP acceptance on exploratory text). Mia's published
    # ~37-45 tok/s figures are non-thinking; the main harness.yaml measures
    # thinking-ON (the default). This variant isolates the mode effect.
    chat_template_kwargs:
      enable_thinking: false

hardware:
  name: DGX Spark
  soc: GB10 Grace Blackwell
  mem_gb: 128
  mem_type: LPDDR5x
  bw_gbs: 273
  fp4_tops: 1000

workload:
  name: chat
  prompt_tokens: 1024
  output_tokens: 256

sweep:
  concurrencies: [1, 2, 4]
  warmup_s: 30
  measure_s: 120
  request_timeout_s: 300
