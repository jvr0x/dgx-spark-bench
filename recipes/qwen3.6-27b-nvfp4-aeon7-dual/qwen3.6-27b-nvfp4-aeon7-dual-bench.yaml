# lmswitch BENCH PROFILE of qwen3.6-27b-nvfp4-aeon7 served TP=2 across both
# Sparks — the dual half of the dual-vs-solo A/B against
# recipes/qwen3.6-27b-nvfp4-aeon7-bench (:8238, single Spark).
#
# Every knob that could move the numbers is held identical to the solo bench
# profile: same image, same DFlash drafter at n=10, ctx 32768, max_num_seqs 64,
# max-num-batched-tokens 16384, chunked prefill + prefix caching on, no
# --kv-cache-dtype (DFlash needs BF16 KV). The ONLY intended difference is
# TP=2 across two nodes. Deltas vs the DAILY dual profile: ctx 131072 -> 32768,
# max_num_seqs 32 -> 64, util 0.75 -> 0.5, explicit KV byte pin added.
#
# Filename id = served-model-name = "qwen3.6-27b-nvfp4-aeon7-dual-bench",
# distinct from the daily driver qwen3.6-27b-nvfp4-aeon7-dual.yaml.
runtime: vllm-dual
model: "AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4"
port: 8888
ctx: 32768
display_name: "Qwen3.6-27B AEON NVFP4 +DFlash [DUAL 2x SPARK BENCH]"

# --- TP=2 across spark (master) + gigabyte (worker) over CX7 ---
worker_host: Gigabyte
master_addr: 10.100.224.2
worker_ip: 10.100.224.1
master_port: 25000
nccl:
  ifname: enp1s0f1np1
  hca: rocep1s0f1
  gid_index: 3

model_path: "~/models/AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4"
worker_model_path: "~/models-spark/AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4"
shm_size: 64g
ready_timeout: 2400

extra_mounts:
  - "~/.cache/vllm-qwen3.6-27b-nvfp4-aeon7-dual:/root/.cache/vllm"
# --- end TP=2 wiring ---

image: "ghcr.io/aeon-7/aeon-vllm-ultimate:2026-07-16-v0.25.1"
entrypoint: "vllm serve"
env:
  TORCH_CUDA_ARCH_LIST: "12.1a"
  CUTE_DSL_ARCH: "sm_121a"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

gpu_memory_utilization: 0.5
max_num_seqs: 64
tool_call_parser: "qwen3_coder"
reasoning_parser: "qwen3"
trust_remote_code: true
attention_backend: "flash_attn"
enforce_eager: false

extra_args:
  # PER RANK, same 32 GiB the solo profile pins: vLLM allocates this out of each
  # worker's own budget, and TP=2 already shards the cache by head, so matching
  # per-rank is the equalization that keeps neither arm cache-starved. Either
  # way the sweep's working set (32 streams x 1280 tok ~ 41K tokens) clears both
  # by a wide margin, so KV size should not bind. The pin's real job is bypassing
  # the AEON build's broken CUDA-graph memory estimator (returns negative -> can
  # kernel-OOM the box at high util). Confirm the startup log's reported
  # "GPU KV cache size" is >= the solo run's before trusting the numbers.
  - "--kv-cache-memory-bytes"
  - "34359738368"
  - "--quantization"
  - "compressed-tensors"
  - "--mamba-cache-dtype"
  - "float32"
  - "--max-num-batched-tokens"
  - "16384"
  - "--enable-chunked-prefill"
  - "--enable-prefix-caching"
  - "--speculative-config"
  - '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":10}'
