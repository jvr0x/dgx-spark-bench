# Harness run config for the kolibri-1 recipe.
# Runs ON the Spark, against the Kolibri-1 server on :8128.

series:
  id: kolibri-1
  model: Kolibri-1
  params_b: 78
  quant: FP8
  backend: vLLM
  status: measured
  weights_gb: 78
  recipe_url: https://github.com/Aleph-Alpha/Kolibri-1
  config:
    checkpoint: Aleph-Alpha/Kolibri-1
    runtime: vLLM
    quantization: FP8
    ctx: 262144
    max_num_seqs: 4
    speculative: NONE
    note: "Kolibri-1 78B-A3.5B FP8, served at 10.100.224.1:8128"
engine:
  base_url: http://10.100.224.1:8128
  model: kolibri-1
  api_key: dummy
  extra_body: {}
hardware:
  name: DGX Spark
  soc: GB10 Grace Blackwell
  mem_gb: 128
  mem_type: LPDDR5x
  bw_gbs: 273
  fp4_tops: 1000
workload:
  name: chat
  prompt_tokens: 1024
  output_tokens: 256
sweep:
  concurrencies: [1, 2, 4, 8]
  warmup_s: 30
  measure_s: 120
  request_timeout_s: 300