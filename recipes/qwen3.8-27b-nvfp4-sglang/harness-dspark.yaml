# Harness run config for the qwen3.8-27b-nvfp4-sglang-dspark-bench recipe.
# Runs ON the Spark, against the bench profile served by lmswitch on :8241.
#
#   lmswitch on qwen3.8-27b-nvfp4-sglang-dspark-bench    # wait for "Ready on port 8241"
#   cd ~/dev/dgx-spark-bench/harness
#   taskset -c 0,1 .venv/bin/python bench.py \
#     ../recipes/qwen3.8-27b-nvfp4-sglang/harness-dspark.yaml \
#     -o ../results/qwen3.8-27b-nvfp4-sglang-dspark-bench.json
#   lmswitch off qwen3.8-27b-nvfp4-sglang-dspark-bench

series:
  id: qwen3.8-27b-nvfp4-sglang-dspark-bench
  model: Qwen3.8-27B
  params_b: 27
  quant: NVFP4-mixed (ModelOpt)
  backend: SGLang nightly-dev-20260814-c4271c3f
  status: measured
  weights_gb: 23.6
  recipe_url: https://github.com/jvr0x/dgx-spark-bench/tree/main/recipes/qwen3.8-27b-nvfp4-sglang
  config:
    checkpoint: RadixArk/Qwen3.8-27B-NVFP4
    runtime: SGLang
    quantization: NVFP4-mixed (ModelOpt, FP8 linear-attn projections)
    architecture: dense hybrid GDN VLM, 48 linear-attention + 16 full-attention layers
    attention_backend: flashinfer
    kv_cache_dtype: fp8_e4m3
    ctx: 32768
    max_running_requests: 64
    speculative: DSpark block drafting, block size 7, 8 draft tokens, drafter=RadixArk/Qwen3.8-27B-DSpark (bf16, 2.6 GB)
    note: "Same target weights, same image, same sweep as qwen3.8-27b-nvfp4-sglang-mtp-bench; the drafter is the only engine-side difference. See caveat — this is NOT a workload-neutral A/B."
    caveat: "Forced 256-token output (ignore_eos + min_tokens) puts both drafters off-distribution. A longer speculative window loses more per rejection, so this workload structurally favours MTP's 4-token chain over DSpark's 7-token block — the two are NOT penalised equally. Upstream measured DSpark ahead on natural code generation, a different acceptance regime. These numbers are not evidence that DSpark is slower in general."

engine:
  base_url: http://localhost:8241
  model: qwen3.8-27b-nvfp4-sglang-dspark-bench
  api_key: dummy
  extra_body:
    ignore_eos: true
    min_tokens: 256

hardware:
  name: DGX Spark
  soc: GB10 Grace Blackwell
  mem_gb: 128
  mem_type: LPDDR5x
  bw_gbs: 273
  fp4_tops: 1000

workload:
  name: chat
  prompt_tokens: 1024
  output_tokens: 256

sweep:
  concurrencies: [1, 2, 4, 8, 16, 32]
  warmup_s: 30
  measure_s: 180
  request_timeout_s: 300
